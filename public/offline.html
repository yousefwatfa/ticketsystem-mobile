<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#009ef7">
    <title>غير متصل - الدعم الفني</title>
    <style>
        :root { --primary: #0077c2; --text: #181c32; --muted: #5e6278; --bg: #f5f8fa; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg); color: var(--text);
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        }
        main { max-width: 420px; text-align: center; }
        img { width: 88px; height: 88px; }
        h1 { font-size: 1.375rem; margin: 20px 0 8px; }
        p { color: var(--muted); line-height: 1.7; margin: 0 0 24px; font-size: 1rem; }
        button {
            min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
            background: var(--primary); color: #fff; font: inherit; font-weight: 700; font-size: 1rem;
            cursor: pointer; touch-action: manipulation;
        }
        button:active { opacity: .85; }
        button:focus-visible { outline: 3px solid #0b5ed7; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="" aria-hidden="true">
        <h1>لست متصلاً بشبكة المستشفى</h1>
        <p>هذا النظام يعمل فقط عند الاتصال بشبكة الـ Wi-Fi الداخلية للمستشفى. اتصل بالشبكة ثم أعد المحاولة.</p>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
</body>
</html>
